name: macOS App

# The SwiftUI app itself can only be compiled on macOS, so CI covers the
# platform-independent OverlandCore module (models, gpclient command
# builder, output parser, bridge orchestration) inside a Linux container, plus
# the Rust change the app relies on (gateway inventory log lines in gpapi).
on:
  push:
    paths:
      - "OverlandApp/**"
      - "crates/gpapi/src/portal/config.rs"
      - ".github/workflows/macos-app.yaml"
    branches:
      - main
      - hotfix/*
      - feature/*
      - release/*
  pull_request:
    paths:
      - "OverlandApp/**"
      - "crates/gpapi/src/portal/config.rs"
      - ".github/workflows/macos-app.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: OverlandCore tests (Linux container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build -t overland-core-tests -f OverlandApp/Dockerfile OverlandApp

      - name: Run tests
        run: docker run --rm overland-core-tests

  gpapi-gateway-inventory:
    name: gpapi portal config tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test -p gpapi --lib portal::config
